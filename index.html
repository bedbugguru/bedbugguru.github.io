<!DOCTYPE html>

<head>

    <title>bed bug guru</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="images/favicon/favicon.ico">

    <!-- Big Cartel Merch Grid Styles -->
    <style>
        .merch-grid-wrapper {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
            font-family: Arial, sans-serif;
            margin-bottom: 40px;
        }
        .band-merch-card {
            border: 1px solid #333; 
            padding: 15px;
            border-radius: 8px;
            width: 250px;
            text-align: center;
            background: #1a1a1a; 
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .merch-img {
            width: 100%;
            height: 250px;
            object-fit: contain; 
            border-radius: 4px;
            margin-bottom: 15px;
            background: #000;
        }
        .merch-title {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            text-transform: uppercase;
        }
        .bc-buy-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 24px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s ease;
        }
        .bc-buy-btn:hover {
            background: #cccccc;
        }
    </style>
</head>
